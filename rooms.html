

<html>
<head>
<title>Agency Website</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/fontawesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
   


</head>

<body>
    <section id="nav-bar">
        <nav class="navbar navbar-expand-lg ">
            <div class="container-fluid">
              <a class="navbar-brand" href="#"><img src="images\demo-logo.png" alt=""></a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fa fa-bars" aria-hidden="true"></i>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link" href="index.html">HOME</a>
                  </li>

                </ul>
              </div>
            </div>
          </nav>
    <!-- ===== ROOMS SECTION ===== -->
    <section class="rooms-section">
        <h1>Our Rooms</h1>

        <div class="room-card">
            <img src="images/room1.jpg" alt="Deluxe Room">
            <h2>Deluxe Valley View Room</h2>
            <p>Enjoy breathtaking valley views, perfect for couples & families.</p>
            <p class="price">₹3,500 / Night</p>
        </div>

        <div class="room-card">
            <img src="images/room2.jpg" alt="Family Room">
            <h2>Premium Family Suite</h2>
            <p>Spacious room ideal for families & long stays with comfort.</p>
            <p class="price">₹4,800 / Night</p>
        </div>
    </section>

    <!-- ===== BOOKING FORM ===== -->
    <section class="booking-form">
        <h2>Book Your Stay</h2>
        <form>
            <label>Your Name:</label>
            <input type="text" placeholder="Full Name" required>

            <label>Phone:</label>
            <input type="tel" placeholder="10-digit number" required>

            <label>Room Type:</label>
            <select required>
                <option disabled selected>Select a room</option>
                <option>Deluxe Valley View Room</option>
                <option>Premium Family Suite</option>
            </select>

            <label>Check-in Date:</label>
            <input type="date" required>

            <label>Check-out Date:</label>
            <input type="date" required>

            <button type="submit">Send Booking Request</button>
        </form>
    </section>


    <!---------------Smooth Scroll------------------>
    <script src="smooth-scroll.js"></script>
    <script>
        var scroll = new SmoothScroll('a[href*="#"]');
    </script>
    
        
</body>
</html>
